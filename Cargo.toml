[package]
name = "viroflash"
version = "0.1.0"
edition = "2021"
description = "Command-line tool for viral candidate detection"
publish = false

[dependencies]
flate2 = { version = "1", default-features = false, features = ["zlib-rs"] }
minimap2 = "0.1"
memchr = "2"
blake3 = "1"
sysinfo = { version = "=0.38.4", default-features = false, features = ["system"] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
