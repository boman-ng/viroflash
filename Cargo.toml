[package]
name = "viroflash"
version = "0.3.0"
edition = "2021"
description = "Command-line tool for viral candidate detection"
publish = false
repository = "https://github.com/boman-ng/viroflash"

[dependencies]
flate2 = { version = "1", default-features = false, features = ["zlib-rs"] }
minimap2 = "0.1"
blake3 = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sysinfo = { version = "=0.38.4", default-features = false, features = ["system"] }

[dev-dependencies]
csv = "1.4"
scraper = { version = "0.27", default-features = false }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
