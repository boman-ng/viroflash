name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust quality and tests
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Cache Cargo data
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-ci-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}

      - name: Report toolchain
        run: rustc --version && cargo --version

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Check types
        run: cargo check --locked

      - name: Lint
        run: cargo clippy --all-targets --all-features --locked -- -D warnings

      - name: Test debug profile
        run: cargo test --all-targets --locked

      - name: Test release profile
        run: cargo test --release --locked

      - name: Build production static binary
        env:
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER: musl-gcc
          RUSTFLAGS: -C target-feature=+crt-static -C link-arg=-Wl,--no-dynamic-linker
        run: |
          sudo apt-get update
          sudo apt-get install --yes musl-tools
          rustup target add x86_64-unknown-linux-musl
          binary=target/x86_64-unknown-linux-musl/release/viroflash
          cargo build --release --locked --target x86_64-unknown-linux-musl
          "${binary}" --help
          if readelf --program-headers "${binary}" | grep -q INTERP; then
            echo "Release binary requires a runtime loader" >&2
            exit 1
          fi
          if readelf --dynamic "${binary}" | grep -q '(NEEDED)'; then
            echo "Release binary has dynamic runtime dependencies" >&2
            exit 1
          fi

  docker:
    name: Docker image
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Build image
        run: docker build --tag viroflash:ci .

      - name: Smoke-test image
        run: |
          docker run --rm viroflash:ci --help
          test_dir="${RUNNER_TEMP}/viroflash-docker-test"
          python3 .github/scripts/create-smoke-fixture.py "${test_dir}"
          chmod -R a+rwX "${test_dir}"
          docker run --rm \
            --volume "${test_dir}:/work" \
            viroflash:ci index \
            --host-fa /work/host.fa \
            --target-fa /work/target.fa \
            --threads 2 \
            --out /work/index
          docker run --rm \
            --volume "${test_dir}:/work" \
            viroflash:ci run \
            --r1 /work/sample.fastq \
            --index /work/index \
            --threads 2 \
            --out /work/result
          expected="$(printf '%s\n' perf.json report.csv report.html)"
          actual="$(find "${test_dir}/result" -mindepth 1 -maxdepth 1 -printf '%f\n' | sort)"
          test "${actual}" = "${expected}"
          test -s "${test_dir}/result/report.csv"
          test -s "${test_dir}/result/report.html"
          test -s "${test_dir}/result/perf.json"

  apptainer:
    name: Apptainer image
    runs-on: ubuntu-22.04
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Cache Cargo data
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-apptainer-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}

      - name: Build Linux binary
        run: cargo build --release --locked

      - name: Install Apptainer
        uses: ./.github/actions/setup-apptainer
        with:
          version: 1.5.3

      - name: Build image
        run: apptainer build --force viroflash.sif Apptainer.def

      - name: Smoke-test image
        run: |
          metadata="$(apptainer inspect --json viroflash.sif)"
          jq -e '.data.attributes.labels["org.opencontainers.image.version"] == "dev"' <<<"${metadata}"
          jq -e '.data.attributes.labels["org.opencontainers.image.revision"] == "unknown"' <<<"${metadata}"
          jq -e '.data.attributes.labels["org.opencontainers.image.description"] == "Reference-group fragment evidence command-line tool"' <<<"${metadata}"
          apptainer run viroflash.sif --help
          test_dir="${RUNNER_TEMP}/viroflash-apptainer-test"
          python3 .github/scripts/create-smoke-fixture.py "${test_dir}"
          apptainer run --bind "${test_dir}:/work" --pwd /work viroflash.sif index \
            --host-fa /work/host.fa \
            --target-fa /work/target.fa \
            --threads 2 \
            --out /work/index
          apptainer run --bind "${test_dir}:/work" --pwd /work viroflash.sif run \
            --r1 /work/sample.fastq \
            --index /work/index \
            --threads 2 \
            --out /work/result
          expected="$(printf '%s\n' perf.json report.csv report.html)"
          actual="$(find "${test_dir}/result" -mindepth 1 -maxdepth 1 -printf '%f\n' | sort)"
          test "${actual}" = "${expected}"
          test -s "${test_dir}/result/report.csv"
          test -s "${test_dir}/result/report.html"
          test -s "${test_dir}/result/perf.json"
