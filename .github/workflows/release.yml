name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

env:
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: always
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  validate:
    name: Validate release tag
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
      revision: ${{ steps.version.outputs.revision }}
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Validate tag and package version
        id: version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if [[ ! "${RELEASE_TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Release tag must have the form vMAJOR.MINOR.PATCH" >&2
            exit 1
          fi
          version="${RELEASE_TAG#v}"
          package_version="$(cargo metadata --locked --no-deps --format-version 1 | jq -r '.packages[0].version')"
          if [[ "${version}" != "${package_version}" ]]; then
            echo "Tag ${RELEASE_TAG} does not match Cargo package version ${package_version}" >&2
            exit 1
          fi
          echo "tag=${RELEASE_TAG}" >> "${GITHUB_OUTPUT}"
          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          echo "revision=$(git rev-parse HEAD)" >> "${GITHUB_OUTPUT}"

  binary:
    name: Linux binary
    needs: validate
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    steps:
      - name: Check out release tag
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.validate.outputs.tag }}

      - name: Cache Cargo data
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-release-linux-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}

      - name: Install static Linux toolchain
        run: |
          sudo apt-get update
          sudo apt-get install --yes musl-tools
          rustup target add x86_64-unknown-linux-musl

      - name: Build and inspect static Linux binary
        env:
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER: musl-gcc
          RUSTFLAGS: -C target-feature=+crt-static -C link-arg=-Wl,--no-dynamic-linker
        run: |
          binary=target/x86_64-unknown-linux-musl/release/viroflash
          cargo build --release --locked --target x86_64-unknown-linux-musl
          "${binary}" --help
          file "${binary}" | grep -q 'x86-64'
          if readelf --program-headers "${binary}" | grep -q INTERP; then
            echo "Release binary requires a runtime loader" >&2
            exit 1
          fi
          if readelf --dynamic "${binary}" | grep -q '(NEEDED)'; then
            echo "Release binary has dynamic runtime dependencies" >&2
            exit 1
          fi

      - name: Package binary
        env:
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          package="viroflash-${VERSION}-linux-x86_64"
          mkdir -p "dist/${package}"
          install -m 0755 target/x86_64-unknown-linux-musl/release/viroflash "dist/${package}/viroflash"
          install -m 0644 README.md "dist/${package}/README.md"
          tar --create --gzip --directory dist --file "dist/${package}.tar.gz" "${package}"
          cd dist
          sha256sum "${package}.tar.gz" > "${package}.tar.gz.sha256"

      - name: Test unpacked release
        env:
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          package="viroflash-${VERSION}-linux-x86_64"
          unpacked="${RUNNER_TEMP}/viroflash-unpacked"
          data="${RUNNER_TEMP}/viroflash-release-test"
          mkdir -p "${unpacked}"
          tar --extract --gzip --file "dist/${package}.tar.gz" --directory "${unpacked}"
          "${unpacked}/${package}/viroflash" --help
          python3 .github/scripts/create-smoke-fixture.py "${data}"
          "${unpacked}/${package}/viroflash" index \
            --host-fa "${data}/host.fa" \
            --target-fa "${data}/target.fa" \
            --threads 2 \
            --out "${data}/index"
          "${unpacked}/${package}/viroflash" run \
            --r1 "${data}/sample.fastq" \
            --index "${data}/index" \
            --threads 2 \
            --out "${data}/result"
          expected="$(printf '%s\n' perf.json report.csv report.html)"
          actual="$(find "${data}/result" -mindepth 1 -maxdepth 1 -printf '%f\n' | sort)"
          test "${actual}" = "${expected}"
          test -s "${data}/result/report.csv"
          test -s "${data}/result/report.html"
          test -s "${data}/result/perf.json"

      - name: Upload binary archive
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: binary
          path: |
            dist/*.tar.gz
            dist/*.sha256
          if-no-files-found: error

  apptainer:
    name: Apptainer SIF
    needs: [validate, binary]
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    steps:
      - name: Check out release tag
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.validate.outputs.tag }}

      - name: Download binary archive
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: binary
          path: dist

      - name: Stage Linux binary
        env:
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          tar --extract --gzip --file "dist/viroflash-${VERSION}-linux-x86_64.tar.gz" --directory dist
          mkdir -p target/release
          cp "dist/viroflash-${VERSION}-linux-x86_64/viroflash" target/release/viroflash

      - name: Install Apptainer
        uses: ./.github/actions/setup-apptainer
        with:
          version: 1.5.3

      - name: Build and test SIF image
        env:
          VERSION: ${{ needs.validate.outputs.version }}
          REVISION: ${{ needs.validate.outputs.revision }}
        run: |
          image="viroflash-${VERSION}-x86_64.sif"
          apptainer build \
            --build-arg "VERSION=${VERSION}" \
            --build-arg "REVISION=${REVISION}" \
            "dist/${image}" Apptainer.def
          apptainer run "dist/${image}" --help
          data="${RUNNER_TEMP}/viroflash-sif-test"
          python3 .github/scripts/create-smoke-fixture.py "${data}"
          apptainer run --bind "${data}:/work" --pwd /work "dist/${image}" index \
            --host-fa /work/host.fa \
            --target-fa /work/target.fa \
            --threads 2 \
            --out /work/index
          apptainer run --bind "${data}:/work" --pwd /work "dist/${image}" run \
            --r1 /work/sample.fastq \
            --index /work/index \
            --threads 2 \
            --out /work/result
          expected="$(printf '%s\n' perf.json report.csv report.html)"
          actual="$(find "${data}/result" -mindepth 1 -maxdepth 1 -printf '%f\n' | sort)"
          test "${actual}" = "${expected}"
          test -s "${data}/result/report.csv"
          test -s "${data}/result/report.html"
          test -s "${data}/result/perf.json"
          cd dist
          sha256sum "${image}" > "${image}.sha256"

      - name: Upload SIF image
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: apptainer
          path: |
            dist/*.sif
            dist/*.sif.sha256
          if-no-files-found: error

  container:
    name: AMD64 OCI image
    needs: [validate, binary, apptainer]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out release tag
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.validate.outputs.tag }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}},value=${{ needs.validate.outputs.tag }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.validate.outputs.tag }},enable=${{ !contains(needs.validate.outputs.version, '-') }}
            type=raw,value=latest,enable=${{ !contains(needs.validate.outputs.version, '-') }}

      - name: Refuse to replace a versioned image
        env:
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          if docker buildx imagetools inspect "${REGISTRY}/${IMAGE_NAME}:${VERSION}" >/dev/null 2>&1; then
            echo "Versioned OCI tag ${VERSION} already exists and is immutable" >&2
            exit 1
          fi

      - name: Build and push image
        id: push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ needs.validate.outputs.version }}
            VCS_REF=${{ needs.validate.outputs.revision }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  publish:
    name: Publish GitHub release
    needs: [validate, binary, apptainer, container]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download release assets
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          pattern: "{binary,apptainer}"
          path: release
          merge-multiple: true

      - name: Verify checksums
        working-directory: release
        run: sha256sum --check *.sha256

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
        run: |
          gh release create "${RELEASE_TAG}" release/* \
            --repo "${GITHUB_REPOSITORY}" \
            --verify-tag \
            --generate-notes \
            --title "Viroflash ${RELEASE_TAG}"
