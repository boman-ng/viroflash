name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: always
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  release:
    runs-on: ubuntu-22.04
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Validate tag and package version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if [[ ! "${RELEASE_TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Release tag must have the form vMAJOR.MINOR.PATCH" >&2
            exit 1
          fi
          version="${RELEASE_TAG#v}"
          package_version="$(cargo metadata --locked --no-deps --format-version 1 | jq -r '.packages[0].version')"
          if [[ "${version}" != "${package_version}" ]]; then
            echo "Tag ${RELEASE_TAG} does not match Cargo package version ${package_version}" >&2
            exit 1
          fi
          echo "VERSION=${version}" >> "${GITHUB_ENV}"
          echo "REVISION=$(git rev-parse HEAD)" >> "${GITHUB_ENV}"

      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/release
            target/x86_64-unknown-linux-musl
          key: cargo-musl-${{ runner.os }}-${{ hashFiles('Cargo.toml', 'Cargo.lock', 'rust-toolchain.toml') }}

      - name: Install build tools
        env:
          APPTAINER_VERSION: 1.5.3
        run: |
          package="apptainer_${APPTAINER_VERSION}_amd64.deb"
          curl --fail --location --silent --show-error \
            "https://github.com/apptainer/apptainer/releases/download/v${APPTAINER_VERSION}/${package}" \
            --output "${RUNNER_TEMP}/${package}"
          sudo apt-get update
          sudo apt-get install --yes musl-tools "${RUNNER_TEMP}/${package}"
          rustup target add x86_64-unknown-linux-musl

      - name: Build and inspect static binary
        env:
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER: musl-gcc
          RUSTFLAGS: -C target-feature=+crt-static -C link-arg=-Wl,--no-dynamic-linker
        run: |
          binary=target/x86_64-unknown-linux-musl/release/viroflash
          cargo build --release --locked --target x86_64-unknown-linux-musl
          file "${binary}" | grep -q 'x86-64'
          if readelf --program-headers "${binary}" | grep -q INTERP || readelf --dynamic "${binary}" | grep -q '(NEEDED)'; then
            echo "Release binary requires a runtime loader or shared libraries" >&2
            exit 1
          fi

      - name: Package and test installed binary
        run: |
          package="viroflash-${VERSION}-linux-x86_64"
          mkdir -p "dist/${package}" "${RUNNER_TEMP}/unpacked"
          install -m755 target/x86_64-unknown-linux-musl/release/viroflash "dist/${package}/viroflash"
          cp README.md "dist/${package}/README.md"
          tar -czf "dist/${package}.tar.gz" -C dist "${package}"
          tar -xzf "dist/${package}.tar.gz" -C "${RUNNER_TEMP}/unpacked"
          install -Dm755 "${RUNNER_TEMP}/unpacked/${package}/viroflash" "${RUNNER_TEMP}/bin/viroflash"
          rustc --edition 2021 .github/scripts/create-smoke-fixture.rs -o "${RUNNER_TEMP}/create-fixture"
          data="${RUNNER_TEMP}/release-test"
          "${RUNNER_TEMP}/create-fixture" "${data}"
          "${RUNNER_TEMP}/bin/viroflash" index --host-fa "${data}/host.fa" --target-fa "${data}/target.fa" --out "${data}/index" --threads 2
          "${RUNNER_TEMP}/bin/viroflash" run --r1 "${data}/sample.fastq" --index "${data}/index" --out "${data}/result" --threads 2
          test "$(ls "${data}/result")" = "$(printf '%s\n' perf.json report.csv report.html)"
          jq -e '.status == "SUCCESS" and .input_fragments == 20 and .prescreen_passed_fragments == 20 and .selected_fragments == 19 and .aligned_fragments == 19' "${data}/result/perf.json"
          test "$(wc -l < "${data}/result/report.csv")" -eq 2
          awk -F, 'NR == 2 {exit !($3 == "target" && $5 == 19 && $6 == 1000000)}' "${data}/result/report.csv"

      - name: Build and test SIF
        run: |
          image="dist/viroflash-${VERSION}-x86_64.sif"
          # Replace the base image's inherited version label with the release version.
          apptainer build --force --build-arg "VERSION=${VERSION}" --build-arg "REVISION=${REVISION}" "${image}" Apptainer.def
          metadata="$(apptainer inspect --json "${image}")"
          jq -e --arg version "${VERSION}" --arg revision "${REVISION}" '.data.attributes.labels | .["org.opencontainers.image.version"] == $version and .["org.opencontainers.image.revision"] == $revision' <<<"${metadata}"
          data="${RUNNER_TEMP}/release-test"
          apptainer run --bind "${data}:/work" --pwd /work "${image}" index --host-fa /work/host.fa --target-fa /work/target.fa --out /work/sif-index --threads 2
          apptainer run --bind "${data}:/work" --pwd /work "${image}" run --r1 /work/sample.fastq --index /work/sif-index --out /work/sif-result --threads 2
          for report in report.csv report.html; do cmp "${data}/result/${report}" "${data}/sif-result/${report}"; done

      - name: Build and test OCI image
        run: |
          docker build --file Dockerfile --tag viroflash:release-test \
            --build-arg "VERSION=${VERSION}" --build-arg "VCS_REF=${REVISION}" "dist/viroflash-${VERSION}-linux-x86_64"
          data="${RUNNER_TEMP}/release-test"
          docker run --rm --network none --user "$(id -u):$(id -g)" --volume "${data}:/work" viroflash:release-test index --host-fa host.fa --target-fa target.fa --out oci-index --threads 2
          docker run --rm --network none --user "$(id -u):$(id -g)" --volume "${data}:/work" viroflash:release-test run --r1 sample.fastq --index oci-index --out oci-result --threads 2
          for report in report.csv report.html; do cmp "${data}/result/${report}" "${data}/oci-result/${report}"; done

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish OCI tags
        run: |
          image="${REGISTRY}/${IMAGE_NAME,,}"
          if docker manifest inspect "${image}:${VERSION}" >/dev/null 2>&1; then
            echo "Versioned OCI tag ${VERSION} already exists and is immutable" >&2
            exit 1
          fi
          tags=("${VERSION}")
          if [[ "${VERSION}" != *-* ]]; then tags+=("${VERSION%.*}" latest); fi
          for tag in "${tags[@]}"; do
            docker tag viroflash:release-test "${image}:${tag}"
            docker push "${image}:${tag}"
          done

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          cd dist
          for asset in *.tar.gz *.sif; do sha256sum "${asset}" > "${asset}.sha256"; done
          gh release create "${RELEASE_TAG}" ./*.tar.gz ./*.sif ./*.sha256 \
            --repo "${GITHUB_REPOSITORY}" --verify-tag --generate-notes --title "Viroflash ${RELEASE_TAG}"
