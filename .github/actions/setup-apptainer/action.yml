name: Set up Apptainer
description: Install an official Apptainer release package on an Ubuntu runner

inputs:
  version:
    description: Apptainer release version without the v prefix
    required: true

runs:
  using: composite
  steps:
    - name: Install official release package
      shell: bash
      env:
        APPTAINER_VERSION: ${{ inputs.version }}
      run: |
        package="apptainer_${APPTAINER_VERSION}_amd64.deb"
        curl --fail --location --silent --show-error \
          "https://github.com/apptainer/apptainer/releases/download/v${APPTAINER_VERSION}/${package}" \
          --output "${RUNNER_TEMP}/${package}"
        sudo apt-get update
        sudo apt-get install --yes "${RUNNER_TEMP}/${package}"
